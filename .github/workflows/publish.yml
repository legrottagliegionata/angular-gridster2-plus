name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci --legacy-peer-deps

      - name: Check the tag against the package version
        run: |
          version=$(node -p "require('./projects/angular-gridster2-plus/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi

      - name: Check whether the version is already on npm
        id: registry
        run: |
          version=$(node -p "require('./projects/angular-gridster2-plus/package.json').version")
          if npm view "angular-gridster2-plus@$version" version > /dev/null 2>&1; then
            echo "angular-gridster2-plus@$version is already published"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "angular-gridster2-plus@$version is not published"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registry.outputs.already_exists == 'false'
        run: npm run test-lib -- --watch=false
      - if: steps.registry.outputs.published == 'false'
      - if: steps.registry.outputs.already_exists == 'false'
        run: npm run build-lib
      - name: Publish package
        if: steps.registry.outputs.already_exists == 'false'
        working-directory: ./dist/angular-gridster2-plus
        run: npm publish
      - name: Create GitHub Release
        if: steps.registry.outputs.already_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
