name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci --legacy-peer-deps

      - name: Check the tag against the package version
        run: |
          version=$(node -p "require('./projects/angular-gridster2/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi

      - name: Check whether the version is already on npm
        id: registry
        run: |
          version=$(node -p "require('./projects/angular-gridster2/package.json').version")
          if npm view "angular-gridster2-plus@$version" version > /dev/null 2>&1; then
            echo "angular-gridster2-plus@$version is already published, nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registry.outputs.published == 'false'
        run: npm run test-lib -- --watch=false
      - if: steps.registry.outputs.published == 'false'
        run: npm run build-lib
      - name: Publish package
        if: steps.registry.outputs.published == 'false'
        working-directory: ./dist/angular-gridster2
        run: npm publish
