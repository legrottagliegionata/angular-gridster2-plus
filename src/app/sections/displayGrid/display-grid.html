<div class="options">
  <a
    mat-raised-button
    href="https://github.com/legrottagliegionata/angular-gridster2-plus/tree/master/src/app/sections/displayGrid"
    target="_blank"
    class="source-code-button"
  >
    <mat-icon>open_in_new</mat-icon>
    Source
  </a>
  <a
    mat-raised-button
    href="https://github.com/legrottagliegionata/angular-gridster2-plus/wiki/Styling#grid-lines"
    target="_blank"
    class="source-code-button"
  >
    <mat-icon>menu_book</mat-icon>
    Docs
  </a>
</div>
<div class="options-header">
  <mat-form-field>
    <mat-label>Display grid lines</mat-label>
    <mat-select aria-label="Display grid lines" [(ngModel)]="options.displayGrid" (ngModelChange)="changedOptions()">
      <mat-option value="always">Always</mat-option>
      <mat-option value="onDrag&Resize">On Drag & Resize</mat-option>
      <mat-option value="none">None</mat-option>
    </mat-select>
  </mat-form-field>
  <button mat-mini-fab (click)="addItem()" class="add-button cols-2">
    <mat-icon>add</mat-icon>
  </button>
</div>

<gridster [options]="options">
  @for (item of dashboard; track item.id) {
    <gridster-item [item]="item">
      <div class="button-holder">
        <button mat-mini-fab (mousedown)="removeItem($event, item)" (touchstart)="removeItem($event, item)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </gridster-item>
  }
</gridster>
